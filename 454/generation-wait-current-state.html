<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generation Wait Today</title>
<style>
:root {
  --bg: #f6f6f8; --panel: #ffffff; --ink: #1d1f27; --muted: #626775; --line: #e2e3e8;
  --accent: #3d7be0; --warn: #b4561e; --ok: #2f8a5b; --chip: #eef0f5;
  --canvas: #15171e; --canvas-dot: #262a35;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101116; --panel: #191b22; --ink: #e8e9ee; --muted: #9a9fad; --line: #2b2e38;
    --accent: #6aa2ff; --warn: #e59a6a; --ok: #6cc795; --chip: #23262f;
  }
}
:root[data-theme="dark"] {
  --bg: #101116; --panel: #191b22; --ink: #e8e9ee; --muted: #9a9fad; --line: #2b2e38;
  --accent: #6aa2ff; --warn: #e59a6a; --ok: #6cc795; --chip: #23262f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
header { max-width: 1240px; margin: 0 auto; padding: 24px 16px 8px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); max-width: 720px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: var(--panel); color: var(--muted); padding: 6px 12px; cursor: pointer; font: inherit; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
main { max-width: 1240px; margin: 0 auto; padding: 8px 16px 40px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
.small { font-size: 12px; color: var(--muted); }

/* ---------- Simulated app ---------- */
.app { border-radius: 12px; overflow: hidden; border: 1px solid #2a2e3a; background: var(--canvas); }
.tabbar { background: #0d0f14; display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; }
.tab { background: var(--canvas); color: #cfd2dc; font-size: 12px; padding: 6px 12px; border-radius: 8px 8px 0 0; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.tab::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: #5a6170; flex: none; }
.tabnote { color: #7c8190; font-size: 11px; }
.stage { position: relative; height: 470px; background-color: var(--canvas);
  background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); background-size: 18px 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
.node-wrap { width: min(380px, 100%); }
.node-title { color: #a8adbb; font-size: 12px; margin: 0 0 6px 2px; display: flex; gap: 6px; align-items: center; }
.node-title b { color: #e3e5ec; font-weight: 600; }
.node { position: relative; aspect-ratio: 16 / 9; border-radius: 11px; background: #1f222c; border: 1px solid #343846; overflow: hidden; }
.node-media { position: absolute; inset: 0; background:
  linear-gradient(160deg, #2c3c5e 0%, #6a4f7a 45%, #d08a6a 80%, #f1c27d 100%); }
.node-media::after { content: "▶"; position: absolute; right: 10px; bottom: 8px; color: #fff; font-size: 12px; opacity: .8; }
.node-media .sun { position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; left: 62%; top: 34%; background: #ffe2a6; box-shadow: 0 0 40px #ffcf80; }
.node-media .hill { position: absolute; left: -10%; right: -10%; bottom: -30%; height: 60%; border-radius: 50%; background: #1d2433; }
.node-placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #6b7080; font-size: 12px; }
.node-failed { position: absolute; inset: 0; display: grid; place-items: center; color: #8a8f9d; font-size: 12px; text-align: center; padding: 12px; }
.arrive { animation: cw-generation-reveal 800ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }

/* Copied from src/canvas/generating.css on main (63279266) */
.cw-generating { position: absolute; inset: 0; z-index: 3; overflow: hidden; isolation: isolate; border-radius: 11px; background: #1c202b; pointer-events: none; animation: cw-generation-enter 240ms ease-out both; }
.cw-generating-field { position: absolute; inset: -25%; filter: blur(26px); opacity: 0.8; }
.cw-generating-field i { position: absolute; width: 64%; height: 70%; border-radius: 50%; animation: cw-generation-drift 6s ease-in-out infinite alternate; }
.cw-generating-field i:nth-child(1) { left: -5%; top: 0; background: radial-gradient(ellipse, #708abe 0%, #708abe00 70%); }
.cw-generating-field i:nth-child(2) { left: 45%; top: 15%; background: radial-gradient(ellipse, #ac8aba 0%, #ac8aba00 70%); animation-delay: -3s; animation-duration: 7s; animation-direction: alternate-reverse; }
.cw-generating-field i:nth-child(3) { left: 0; top: 50%; background: radial-gradient(ellipse, #71a7a1 0%, #71a7a100 70%); animation-delay: -2s; animation-duration: 5s; }
.cw-generating-field i:nth-child(4) { left: 45%; top: 55%; background: radial-gradient(ellipse, #c1a896 0%, #c1a89600 70%); animation-delay: -4s; animation-duration: 8s; animation-direction: alternate-reverse; }
.cw-generating-stars { position: absolute; inset: 0; opacity: 0.42; background-image: radial-gradient(circle at 22% 28%, #e9f1ff 0 1px, transparent 1.8px), radial-gradient(circle at 67% 36%, #f4ebff 0 1px, transparent 1.8px), radial-gradient(circle at 42% 66%, #d9f8ef 0 0.7px, transparent 1.6px), radial-gradient(circle at 80% 72%, #e9f1ff 0 0.7px, transparent 1.6px); animation: cw-generation-stars 3.6s ease-in-out infinite alternate; }
.cw-generating-sheen { position: absolute; inset: -30%; background: linear-gradient(110deg, transparent 35%, #e9f2ff20 49%, #e9f2ff08 54%, transparent 65%); animation: cw-generation-sweep 3.2s ease-in-out infinite; }
.cw-generating-caption { position: absolute; bottom: 16px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; color: #f0f0f6; font-size: 11px; line-height: 1.5; text-shadow: 0 1px 6px #000b; }
.cw-generating-indicator { width: 5px; height: 5px; border-radius: 50%; background: #e2def9; box-shadow: 0 0 9px #dfd7ff9c; animation: cw-generation-stars 1.6s ease-in-out infinite alternate; }
.cw-generating-count { opacity: 0.7; }
.cw-generating[data-phase="queued"] .cw-generating-field { opacity: 0.3; }
.cw-generating[data-phase="queued"] .cw-generating-field i { animation-duration: 12s; }
.cw-generating[data-phase="queued"] .cw-generating-sheen { display: none; }
.cw-generating[data-phase="finishing"] .cw-generating-sheen { animation-duration: 1.8s; }
.cw-generating-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.cw-generating-ring path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.cw-generating-ring-track { stroke: #ffffff14; stroke-width: 2; }
.cw-generating-ring-progress { stroke: #5aa8ff; stroke-width: 2; filter: drop-shadow(0 0 3px #3d8bffaa); transition: stroke-dashoffset 250ms linear; }
@keyframes cw-generation-drift { from { transform: translate(-12%, -8%) scale(0.85); } to { transform: translate(15%, 12%) scale(1.2); } }
@keyframes cw-generation-sweep { from { transform: translateX(-65%); } to { transform: translateX(65%); } }
@keyframes cw-generation-stars { from { opacity: 0.2; } to { opacity: 0.7; } }
@keyframes cw-generation-enter { from { opacity: 0; } to { opacity: 1; } }
@keyframes cw-generation-reveal { from { opacity: 0.25; filter: blur(8px); } to { opacity: 1; filter: blur(0); } }
@media (prefers-reduced-motion: reduce) {
  .cw-generating, .cw-generating-field i, .cw-generating-stars, .cw-generating-sheen, .cw-generating-indicator, .arrive { animation: none; }
  .cw-generating-sheen { display: none; }
  .cw-generating-ring-progress { transition: none; }
}

/* Composer (simplified look) */
.composer { width: min(380px, 100%); background: #1d2029; border: 1px solid #343846; border-radius: 12px; padding: 10px; color: #d8dbe4; }
.composer.running { border-color: #78728e; }
.prompt { font-size: 12px; color: #c9ccd6; min-height: 36px; }
.composer.running .prompt, .composer.running .chips span { opacity: .45; }
.crow { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.chips { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.chips span { font-size: 11px; background: #2a2e3a; border-radius: 6px; padding: 2px 8px; color: #b8bcc8; }
.run { width: 32px; height: 32px; border-radius: 50%; border: 0; display: grid; place-items: center; background: #e8e9ee; color: #15171e; font-size: 16px; }
.run.cancel { background: #3a3e4b; color: #f0f0f6; }
.run.cancel::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
.run:not(.cancel)::before { content: "↑"; font-weight: 700; }
.hint { position: absolute; font-size: 11px; color: #ffd28a; background: #3a2f1a; border: 1px dashed #8a6a2e; border-radius: 6px; padding: 2px 6px; }

/* Toasts */
.toasts { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: calc(100% - 32px); pointer-events: none; }
.toast { background: #2b2f3b; color: #eef0f5; font-size: 12px; padding: 8px 12px; border-radius: 8px; box-shadow: 0 6px 20px #0008; max-width: 100%; animation: cw-generation-enter 200ms ease-out both; }
.toast.fail { background: #3b2424; }

/* Controls */
.controls { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--line); background: var(--chip); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
label.lbl { font-size: 12px; color: var(--muted); min-width: 64px; }
input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--chip); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v.hidden-to-user::after { content: attr(data-tag); display: block; font-size: 10px; font-weight: 400; color: var(--warn); }
svg.curve { width: 100%; height: auto; display: block; }
svg.curve text { fill: var(--muted); font-size: 10px; }
.findings { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.findings li { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
.findings li.gap { border-left-color: var(--warn); }
.findings li b { display: block; font-size: 13px; }
.findings li span { color: var(--muted); font-size: 13px; }
.findings code, .src code { font-size: 12px; background: var(--chip); padding: 0 4px; border-radius: 4px; }
.timeline { display: grid; gap: 4px; font-size: 13px; }
.timeline div { display: grid; grid-template-columns: 84px 1fr; gap: 8px; color: var(--muted); }
.timeline div.now { color: var(--ink); font-weight: 600; }
.full { grid-column: 1 / -1; }
.src { color: var(--muted); font-size: 12px; }

/* Screenshot mode: ?shot=1 shows only the simulated canvas */
body.shot { background: #ff00ff; }
body.shot header, body.shot main > section:not(:first-child), body.shot main > section:first-child > h2, body.shot main > section:first-child > .small { display: none; }
body.shot main { display: block; padding: 0; max-width: none; margin: 0; }
body.shot main > section:first-child { border: 0; padding: 0; background: none; border-radius: 0; }
body.shot .app { border-radius: 0; border: 0; }
body.shot .stage { min-height: 0; padding-bottom: 28px; }
body.shot .tabnote, body.shot #nodeModel { display: none; }
.proto-banner { max-width: 1280px; margin: 12px auto 0; padding: 6px 16px; font-size: 12px; color: var(--muted); }
.proto-banner a { color: var(--accent); }
body.shot .proto-banner { display: none; }
</style>
</head>
<body>
<div class="proto-banner">个人原型，用于 <a href="https://github.com/ThinkFlowLab/OpenDirector/issues/454">#454</a> 讨论，非正式功能 · Personal prototype for discussing <a href="https://github.com/ThinkFlowLab/OpenDirector/issues/454">#454</a>, not a shipped feature</div>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh-CN">中文</button>
    <button type="button" data-lang="en-US">English</button>
  </div>
</header>

<main>
  <section class="card">
    <h2 data-i18n="simTitle"></h2>
    <div class="app">
      <div class="tabbar"><div class="tab" id="tabTitle">OpenDirector</div><span class="tabnote" data-i18n="tabNote"></span></div>
      <div class="stage">
        <div class="node-wrap">
          <div class="node-title"><span>▣</span><b data-i18n="nodeName"></b><span id="nodeModel">· 180s</span></div>
          <div class="node" id="node"></div>
        </div>
        <div class="composer" id="composer">
          <div class="prompt" data-i18n="prompt"></div>
          <div class="crow">
            <div class="chips"><span data-i18n="chipModel"></span><span>16:9</span><span>5s</span><span>@</span></div>
            <button class="run" id="runBtn" type="button" aria-label="run"></button>
          </div>
        </div>
        <div class="toasts" id="toasts"></div>
      </div>
    </div>
    <p class="small" data-i18n="simNote" style="margin:10px 0 0"></p>
  </section>

  <section class="card controls">
    <h2 data-i18n="ctrlTitle" style="margin:0"></h2>
    <div class="row"><label class="lbl" data-i18n="scenario"></label>
      <div class="seg" id="scenarioSeg">
        <button type="button" data-s="typical" data-i18n="sTypical"></button>
        <button type="button" data-s="slow" data-i18n="sSlow"></button>
        <button type="button" data-s="queued" data-i18n="sQueued"></button>
        <button type="button" data-s="fail" data-i18n="sFail"></button>
        <button type="button" data-s="batch" data-i18n="sBatch"></button>
      </div>
    </div>
    <div class="row"><label class="lbl" data-i18n="speed"></label>
      <div class="seg" id="speedSeg">
        <button type="button" data-x="1">1×</button>
        <button type="button" data-x="10">10×</button>
        <button type="button" data-x="30">30×</button>
      </div>
      <button class="btn primary" id="playBtn" type="button"></button>
      <button class="btn" id="resetBtn" type="button" data-i18n="reset"></button>
    </div>
    <div class="row"><label class="lbl" data-i18n="scrub"></label><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="scrub"></div>
    <div class="stats">
      <div class="stat"><div class="k" data-i18n="kPhase"></div><div class="v" id="vPhase">—</div></div>
      <div class="stat"><div class="k" data-i18n="kRing"></div><div class="v" id="vRing">—</div></div>
      <div class="stat"><div class="k" data-i18n="kElapsed"></div><div class="v hidden-to-user" id="vElapsed">—</div></div>
      <div class="stat"><div class="k" data-i18n="kActual"></div><div class="v hidden-to-user" id="vActual">—</div></div>
    </div>
    <svg class="curve" id="curve" viewBox="0 0 400 170" role="img" aria-label="progress curve"></svg>
    <div class="timeline" id="timeline"></div>
  </section>

  <section class="card full">
    <h2 data-i18n="findTitle"></h2>
    <ul class="findings" id="findings"></ul>
    <p class="src" data-i18n="sources" style="margin:14px 0 0"></p>
  </section>
</main>

<script>
const I18N = {
  "zh-CN": {

    prompt: "A shore at dusk, slow push-in, waves breaking on the rocks…",
    chipModel: "Video model",
    simNote: "The node overlay, animation, progress ring, copy and toasts match the source. The video result is a stand-in picture.",
    ctrlTitle: "Playback",
    scenario: "Scenario", sTypical: "Typical (~3 min)", sSlow: "Slower than expected (6 min)", sQueued: "Queued first", sFail: "Fails", sBatch: "3 jobs on one node",
    speed: "Speed", play: "▶ Play", pause: "❚❚ Pause", reset: "Reset", scrub: "Scrub",
    kPhase: "Phase label", kRing: "Ring", kElapsed: "Waited", kActual: "Actual duration",
    hiddenTag: "not shown to user",
    curveX: "waited (s)", curveY: "ring", expected: "expected", now: "now", cap: "97% cap",
    tl: { start: "Click generate", accepted: "Submitted toast", queued: "Queued", generating: "Generating", finishing: "Read & save", done: "Result appears", failed: "Failure toast" },
    phase: { idle: "Not started", preparing: "Preparing references", submitting: "Submitting to the model service", queued: "Queued", generating: "Generating with the model service", finishing: "Reading and saving the result", done: "Done", failed: "Failed" },
    tasks: "{n} tasks",
    toastSubmitted: "Generation submitted. Results will be saved to this project.",
    toastFailed: "Generation failed for “Video node · Sunset shore”. Check generation history before retrying.",
    emptyNode: "Empty video node",
    failedNode: "The node goes back to how it was (empty), with no failure mark",
    findTitle: "What happens today",
    findings: [
      ["gap", "No elapsed or remaining time", "The node shows only a phase label and a progress ring. Users can't tell how long they've waited or how long is left."],
      ["gap", "The ring is a time estimate, not real progress", "Model services report no step progress, so the ring grows as <code>0.97 × (1 − e^(−2.5·t/expected))</code>: about 69% at half the expected time, about 89% at the expected time, capped at 97%. When a job runs slow, the ring sits in the 90s for a long time."],
      ["", "Expected time: 180 s default for video, then learned on this machine", "After each success it updates a weighted average (new sample weight 0.4), stored in browser localStorage per model or tool. A different browser or cleared storage goes back to 180 s."],
      ["gap", "Nothing announces success", "There's a toast on submit and a toast on failure, but success is only a 0.8 s blur-in on the node. If the node is off-screen or the user is in another tab, they won't know it's done. The browser tab title never changes."],
      ["", "Failure is announced and the node goes back to how it was", "The toast gives the node name and reason (when known) and suggests checking generation history before retrying."],
      ["", "The composer is locked while waiting", "Prompt, settings and references are disabled, and the send button becomes Cancel. The user can keep working elsewhere on the canvas."],
      ["", "Queueing and batches", "Queued jobs dim the background and drop the sheen. Several jobs on one node show “N tasks”; progress merges the earliest start and the longest expected time."],
      ["", "The wait itself", "Apart from the animated background there are no tips, knowledge or interaction. That's the gap #454 is about."]
    ],
    sources: "Sources: <code>src/canvas/GeneratingOverlay.tsx</code>, <code>generating.css</code>, <code>generationDurations.ts</code>, <code>generationActivity.ts</code>, <code>workspace/useWorkspaceGeneration.ts</code>, <code>NodeComposer.tsx</code>, <code>i18n/messages</code>. Phase lengths are illustrative; real durations depend on the model service."
  }
};

// Scenario scripts, in seconds. expected = what the ring believes; total = what actually happens.
const SCENARIOS = {
  typical: { expected: 180, steps: [["preparing", 2], ["submitting", 3], ["generating", 170], ["finishing", 5]], end: "done" },
  slow:    { expected: 180, steps: [["preparing", 2], ["submitting", 3], ["generating", 350], ["finishing", 5]], end: "done" },
  queued:  { expected: 180, steps: [["preparing", 2], ["submitting", 3], ["queued", 60], ["generating", 170], ["finishing", 5]], end: "done" },
  fail:    { expected: 180, steps: [["preparing", 2], ["submitting", 3], ["generating", 95]], end: "failed" },
  batch:   { expected: 180, steps: [["preparing", 2], ["submitting", 3], ["generating", 200], ["finishing", 5]], end: "done", count: 3 }
};

let lang = "zh-CN";
try { const saved = localStorage.getItem("gw-lang"); if (saved && I18N[saved]) lang = saved; } catch {}
let scenario = "typical", speed = 10, t = 0, playing = false, last = 0;
const L = () => I18N[lang];
const $ = (id) => document.getElementById(id);

function total(s) { return s.steps.reduce((a, [, d]) => a + d, 0); }
function estimatedProgress(elapsed, expected) {
  if (!(expected > 0) || !(elapsed > 0)) return 0;
  return 0.97 * (1 - Math.exp((-2.5 * elapsed) / expected));
}
function state(time) {
  const s = SCENARIOS[scenario];
  let acc = 0;
  for (const [phase, d] of s.steps) { if (time < acc + d) return { phase, acc }; acc += d; }
  return { phase: s.end, acc };
}
function acceptedAt() { const s = SCENARIOS[scenario]; return s.steps[0][1] + s.steps[1][1]; }
function fmt(sec) { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }

function outline(w, h, inset) {
  const R = 11, r = Math.max(0, Math.min(R - inset, w / 2, h / 2));
  const x0 = inset, y0 = inset, x1 = w - inset, y1 = h - inset, k = r * (1 - Math.SQRT1_2);
  return [`M${x0 + k},${y0 + k}`, `A${r},${r} 0 0 1 ${x0 + r},${y0}`, `H${x1 - r}`, `A${r},${r} 0 0 1 ${x1},${y0 + r}`, `V${y1 - r}`,
    `A${r},${r} 0 0 1 ${x1 - r},${y1}`, `H${x0 + r}`, `A${r},${r} 0 0 1 ${x0},${y1 - r}`, `V${y0 + r}`, `A${r},${r} 0 0 1 ${x0 + k},${y0 + k}`].join(" ");
}

let renderedKey = "";
function renderNode() {
  const node = $("node"), { phase } = state(t), s = SCENARIOS[scenario];
  const started = t > 0 || playing;
  const key = !started ? "idle" : phase === "done" ? "done" : phase === "failed" ? "failed" : "gen";
  if (key !== renderedKey) {
    renderedKey = key;
    if (key === "idle") node.innerHTML = `<div class="node-placeholder">${L().emptyNode}</div>`;
    else if (key === "done") node.innerHTML = `<div class="node-media arrive"><div class="sun"></div><div class="hill"></div></div>`;
    else if (key === "failed") node.innerHTML = `<div class="node-failed">${L().emptyNode}<br><span style="opacity:.7">(${L().failedNode})</span></div>`;
    else node.innerHTML = `<div class="cw-generating"><div class="cw-generating-field"><i></i><i></i><i></i><i></i></div><div class="cw-generating-stars"></div><div class="cw-generating-sheen"></div>
      <svg class="cw-generating-ring" aria-hidden="true"><path class="cw-generating-ring-track" pathLength="100"/><path class="cw-generating-ring-progress" pathLength="100" stroke-dasharray="100 100"/></svg>
      <div class="cw-generating-caption" role="status"><span class="cw-generating-indicator"></span><span id="cap"></span><span class="cw-generating-count" id="cnt"></span></div></div>`;
  }
  if (key === "gen") {
    const ov = node.querySelector(".cw-generating");
    ov.dataset.phase = phase;
    const svg = node.querySelector("svg"), w = svg.clientWidth, h = svg.clientHeight;
    const d = outline(w, h, 1);
    svg.querySelectorAll("path").forEach((p) => p.setAttribute("d", d));
    let prog = estimatedProgress(t, s.expected);
    if (phase === "finishing") prog = Math.max(prog, 0.98);
    svg.querySelector(".cw-generating-ring-progress").setAttribute("stroke-dashoffset", 100 - prog * 100);
    $("cap").textContent = L().phase[phase];
    $("cnt").textContent = s.count > 1 ? L().tasks.replace("{n}", s.count) : "";
  }
}

let toastKey = "";
function renderToasts() {
  const s = SCENARIOS[scenario], acc = acceptedAt(), list = [];
  if (t >= acc && t < acc + 4) list.push(["", L().toastSubmitted]);
  const end = total(s);
  if (s.end === "failed" && t >= end && t < end + 5) list.push(["fail", L().toastFailed]);
  const k = lang + JSON.stringify(list);
  if (k === toastKey) return;
  toastKey = k;
  $("toasts").innerHTML = list.map(([c, m]) => `<div class="toast ${c}">${m}</div>`).join("");
}

function renderComposer() {
  const { phase } = state(t), started = t > 0 || playing;
  const running = started && phase !== "done" && phase !== "failed";
  $("composer").classList.toggle("running", running);
  $("runBtn").classList.toggle("cancel", running);
  $("runBtn").setAttribute("aria-label", running ? "cancel" : "run");
}

function renderStats() {
  const s = SCENARIOS[scenario], { phase } = state(t), started = t > 0 || playing;
  const shown = !started ? "idle" : phase;
  $("vPhase").textContent = L().phase[shown];
  $("vPhase").title = L().phase[shown];
  let prog = started && !["done", "failed"].includes(phase) ? estimatedProgress(t, s.expected) : null;
  if (phase === "finishing") prog = Math.max(prog, 0.98);
  $("vRing").textContent = prog === null ? "—" : `${Math.round(prog * 100)}%`;
  $("vElapsed").textContent = fmt(Math.min(t, total(s)));
  $("vActual").textContent = fmt(total(s));
  $("vElapsed").dataset.tag = L().hiddenTag;
  $("vActual").dataset.tag = L().hiddenTag;
  $("nodeModel").textContent = `· ${lang === "zh-CN" ? "预期" : "expected"} ${s.expected}s`;
  $("scrub").value = Math.round((t / (total(s) + 8)) * 1000);
}

function renderCurve() {
  const s = SCENARIOS[scenario], T = Math.max(total(s), s.expected * 1.2) + 10;
  const W = 400, H = 170, px = 34, py = 14, pw = W - px - 10, ph = H - py - 28;
  const X = (sec) => px + (sec / T) * pw, Y = (p) => py + (1 - p) * ph;
  let d = "";
  for (let i = 0; i <= 80; i++) { const sec = (T * i) / 80; d += `${i ? "L" : "M"}${X(sec).toFixed(1)},${Y(estimatedProgress(sec, s.expected)).toFixed(1)}`; }
  const end = total(s), cur = Math.min(t, end);
  const curP = state(t).phase === "finishing" ? Math.max(0.98, estimatedProgress(cur, s.expected)) : estimatedProgress(cur, s.expected);
  const ticks = [0, 0.5, 0.97].map((p) => `<line x1="${px}" x2="${W - 10}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${px - 4}" y="${Y(p) + 3}" text-anchor="end">${Math.round(p * 100)}%</text>`).join("");
  const xt = [0, 60, 120, 180, 240, 300, 360, 420].filter((v) => v <= T).map((v) => `<text x="${X(v)}" y="${H - 12}" text-anchor="middle">${v}</text>`).join("");
  $("curve").innerHTML = `${ticks}${xt}
    <text x="${W - 10}" y="${H - 1}" text-anchor="end">${L().curveX}</text>
    <line x1="${X(s.expected)}" x2="${X(s.expected)}" y1="${py}" y2="${py + ph}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${X(s.expected) + 3}" y="${py + 10}">${L().expected} ${s.expected}s · 89%</text>
    <line x1="${X(end)}" x2="${X(end)}" y1="${py}" y2="${py + ph}" stroke="var(--warn)" stroke-dasharray="3 3"/>
    <text x="${X(end) - 3}" y="${py + ph - 4}" text-anchor="end" style="fill:var(--warn)">${s.end === "failed" ? L().tl.failed : L().tl.done} ${end}s</text>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${X(cur)}" cy="${Y(curP)}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
}

function renderTimeline() {
  const s = SCENARIOS[scenario], tl = L().tl, rows = [[0, tl.start]];
  let acc = 0;
  for (const [phase, dur] of s.steps) {
    if (phase === "queued") rows.push([acc, tl.queued]);
    if (phase === "generating") rows.push([acc, tl.generating]);
    if (phase === "finishing") rows.push([acc, tl.finishing]);
    acc += dur;
    if (phase === "submitting") rows.push([acc, tl.accepted]);
  }
  rows.push([acc, s.end === "failed" ? tl.failed : tl.done]);
  let nowIdx = 0; rows.forEach(([at], i) => { if (t >= at) nowIdx = i; });
  $("timeline").innerHTML = rows.map(([at, txt], i) => `<div class="${i === nowIdx && (t > 0 || playing) ? "now" : ""}"><span>${fmt(at)}</span><span>${txt}</span></div>`).join("");
}

function renderAll() { renderNode(); renderToasts(); renderComposer(); renderStats(); renderCurve(); renderTimeline(); }

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { const v = L()[el.dataset.i18n]; if (typeof v === "string") el.innerHTML = v; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("findings").innerHTML = L().findings.map(([c, h, b]) => `<li class="${c}"><b>${h}</b><span>${b}</span></li>`).join("");
  $("playBtn").textContent = playing ? L().pause : L().play;
  renderedKey = ""; toastKey = "";
  renderAll();
}

function setPressed(seg, attr, value) { seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === String(value)))); }

function tick(now) {
  if (!playing) return;
  const dt = Math.max(0, (now - last) / 1000); last = now;
  const end = total(SCENARIOS[scenario]) + 8;
  t = Math.min(end, t + dt * speed);
  if (t >= end) { playing = false; $("playBtn").textContent = L().play; }
  renderAll();
  if (playing) requestAnimationFrame(tick);
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("gw-lang", lang); } catch {} applyLang();
}));
$("scenarioSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  scenario = b.dataset.s; setPressed($("scenarioSeg"), "s", scenario); t = 0; playing = false; $("playBtn").textContent = L().play; renderedKey = ""; renderAll();
});
$("speedSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; speed = Number(b.dataset.x); setPressed($("speedSeg"), "x", speed); });
$("playBtn").addEventListener("click", () => {
  if (t >= total(SCENARIOS[scenario]) + 8) t = 0;
  playing = !playing; $("playBtn").textContent = playing ? L().pause : L().play;
  if (playing) { last = performance.now(); requestAnimationFrame(tick); }
  renderAll();
});
$("runBtn").addEventListener("click", () => { if (!playing && t === 0) $("playBtn").click(); });
$("resetBtn").addEventListener("click", () => { t = 0; playing = false; $("playBtn").textContent = L().play; renderedKey = ""; renderAll(); });
$("scrub").addEventListener("input", (e) => { t = (Number(e.target.value) / 1000) * (total(SCENARIOS[scenario]) + 8); renderAll(); });
new ResizeObserver(() => renderNode()).observe($("node"));

setPressed($("scenarioSeg"), "s", scenario);
setPressed($("speedSeg"), "x", speed);
// URL state for screenshots and links: ?lang=zh-CN&sc=typical&t=95&shot=1
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("lang") && I18N[q.get("lang")]) lang = q.get("lang");
  if (q.get("sc") && SCENARIOS[q.get("sc")]) scenario = q.get("sc");
  if (q.get("t")) t = Math.max(0, Number(q.get("t")) || 0);
  setPressed($("scenarioSeg"), "s", scenario);
  if (q.get("shot") === "1") document.body.classList.add("shot");
  setPressed($("scenarioSeg"), "s", scenario);
})();

applyLang();
</script>
</body>
</html>
